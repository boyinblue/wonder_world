<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Puzzle</title>
  <style>
    :root {
      --bg-1: #0e1a2b;
      --bg-2: #152a3f;
      --panel: rgba(244, 241, 232, 0.96);
      --ink: #1a1a1a;
      --muted: #5c5c5c;
      --accent: #f26f3a;
      --accent-2: #1fa59b;
      --line: #d8d2c6;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: #fff;
      background:
        radial-gradient(1100px 550px at 12% 10%, #204265 0%, transparent 55%),
        radial-gradient(900px 500px at 88% 90%, #183b50 0%, transparent 60%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .portal-back {
      position: fixed;
      left: 14px;
      top: 14px;
      z-index: 60;
      width: 44px;
      height: 44px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      text-decoration: none;
      font-size: 22px;
      font-weight: 900;
      color: #fff;
      background: rgba(8, 14, 28, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.36);
      transition: transform 140ms ease, background 140ms ease;
    }

    .portal-back:hover {
      transform: translateY(-1px);
      background: rgba(18, 27, 47, 0.88);
    }

    .wrap {
      width: min(1140px, 100%);
      display: grid;
      grid-template-columns: 330px 1fr;
      gap: 20px;
      align-items: start;
      margin-top: 8px;
    }

    @media (max-width: 880px) {
      .wrap {
        grid-template-columns: 1fr;
      }
    }

    .sidebar {
      border-radius: 20px;
      background: var(--panel);
      color: var(--ink);
      border: 2px solid #f0e8d8;
      box-shadow: var(--shadow);
      padding: 20px;
      display: grid;
      gap: 16px;
    }

    .sidebar h1 {
      margin: 0;
      font-size: 28px;
      text-transform: lowercase;
      letter-spacing: 0.5px;
    }

    .sub {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
    }

    .section {
      border-top: 1px solid var(--line);
      padding-top: 14px;
      display: grid;
      gap: 10px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #444;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button, .file-label {
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      padding: 9px 12px;
      border-radius: 10px;
      border: 2px solid var(--ink);
      background: #fffdf7;
      color: var(--ink);
      cursor: pointer;
      transition: transform 100ms ease, background 120ms ease, color 120ms ease;
      text-align: center;
      user-select: none;
    }

    button:hover, .file-label:hover {
      background: #eee7d8;
    }

    button.active {
      background: var(--ink);
      color: #fff;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.primary:hover {
      background: #d95b28;
      border-color: #d95b28;
    }

    button.secondary {
      background: var(--accent-2);
      border-color: var(--accent-2);
      color: #fff;
    }

    button.secondary:hover {
      background: #188a81;
      border-color: #188a81;
    }

    input[type="file"] {
      display: none;
    }

    .custom-grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr auto;
      gap: 6px;
      align-items: center;
    }

    .custom-grid input[type="number"] {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 2px solid #c9c1b2;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      background: #fff;
      color: var(--ink);
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .stat-box {
      background: #fffdf7;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
    }

    .stat-box small {
      display: block;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .stat-box strong {
      font-size: 20px;
      color: var(--ink);
    }

    .file-info {
      font-size: 12px;
      color: #333;
      background: #efeadd;
      padding: 8px 10px;
      border-radius: 8px;
      word-break: break-all;
      line-height: 1.4;
    }

    .preview-box {
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--line);
      background: #111;
      display: none;
    }

    .preview-box.show {
      display: block;
    }

    .preview-box img {
      display: block;
      width: 100%;
      max-height: 180px;
      object-fit: contain;
    }

    .stage {
      border-radius: 22px;
      background: rgba(10, 18, 32, 0.56);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: var(--shadow);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 620px;
      position: relative;
    }

    .board-container {
      position: relative;
      display: inline-grid;
      gap: 2px;
      background: #0b1220;
      padding: 6px;
      border-radius: 14px;
      border: 2px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      user-select: none;
    }

    .tile {
      position: relative;
      background-repeat: no-repeat;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 90ms ease, filter 120ms ease;
      overflow: hidden;
    }

    .tile:hover {
      filter: brightness(1.08);
    }

    .tile.empty {
      background: rgba(255, 255, 255, 0.04) !important;
      cursor: default;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
    }

    .tile .num {
      position: absolute;
      top: 4px;
      left: 5px;
      font-size: 11px;
      font-weight: 800;
      color: #fff;
      background: rgba(0, 0, 0, 0.58);
      padding: 1px 5px;
      border-radius: 4px;
      pointer-events: none;
    }

    .win-banner {
      position: absolute;
      inset: 0;
      background: rgba(8, 13, 24, 0.78);
      border-radius: 22px;
      display: none;
      place-items: center;
      text-align: center;
      padding: 24px;
      z-index: 20;
    }

    .win-banner.show {
      display: grid;
    }

    .win-card {
      background: var(--panel);
      color: var(--ink);
      border-radius: 20px;
      padding: 26px 32px;
      border: 2px solid #f0e8d8;
      max-width: 420px;
      width: 100%;
    }

    .win-card h2 {
      margin: 0 0 8px;
      font-size: 32px;
      color: var(--accent);
    }

    .win-card p {
      margin: 6px 0;
      color: #333;
      font-size: 15px;
    }

    .hint-text {
      margin-top: 12px;
      font-size: 12px;
      color: #b8c4d8;
      text-align: center;
    }
  </style>
</head>
<body>
  <a class="portal-back" href="index.html" title="Arcade Hub로 돌아가기">←</a>

  <div class="wrap">
    <aside class="sidebar">
      <div>
        <h1>photo puzzle</h1>
        <p class="sub">로컬 JPEG 이미지를 불러와 원하는 크기로 맞추는 슬라이딩 퍼즐입니다.</p>
      </div>

      <div class="section">
        <div class="section-title">1. 이미지 불러오기 (.jpg / .jpeg)</div>
        <div class="btn-row">
          <label class="file-label" for="singleFileInput">파일 지정 선택</label>
          <input id="singleFileInput" type="file" accept=".jpg,.jpeg,image/jpeg" />

          <label class="file-label" for="folderInput">폴더에서 랜덤</label>
          <input id="folderInput" type="file" webkitdirectory directory multiple />
        </div>
        <div class="btn-row">
          <button id="randomPickBtn" class="secondary" type="button">폴더 내 다른 JPEG 랜덤</button>
          <button id="builtinRandomBtn" type="button">기본 샘플 이미지</button>
        </div>
        <div id="fileInfo" class="file-info">현재 이미지: 기본 생성 샘플 아트</div>
      </div>

      <div class="section">
        <div class="section-title">2. 퍼즐 크기 (행 × 열)</div>
        <div class="btn-row" id="presetBtns">
          <button type="button" data-r="3" data-c="3" class="active">3 × 3</button>
          <button type="button" data-r="4" data-c="4">4 × 4</button>
          <button type="button" data-r="5" data-c="5">5 × 5</button>
        </div>
        <div class="custom-grid">
          <input id="customRows" type="number" min="2" max="15" value="6" title="행 (2~15)" />
          <span>×</span>
          <input id="customCols" type="number" min="2" max="15" value="6" title="열 (2~15)" />
          <button id="applyCustomBtn" type="button">적용</button>
        </div>
      </div>

      <div class="section">
        <div class="section-title">3. 컨트롤 및 현황</div>
        <div class="btn-row">
          <button id="shuffleBtn" class="primary" type="button">다시 섞기</button>
          <button id="togglePreviewBtn" type="button">원본 미리보기</button>
          <button id="toggleNumBtn" type="button">번호 표시: ON</button>
        </div>
        <div class="stats">
          <div class="stat-box">
            <small>이동 횟수</small>
            <strong id="moveCount">0</strong>
          </div>
          <div class="stat-box">
            <small>경과 시간</small>
            <strong id="timerText">00:00</strong>
          </div>
        </div>
        <div id="previewBox" class="preview-box">
          <img id="previewImg" alt="원본 미리보기" />
        </div>
      </div>
    </aside>

    <main class="stage">
      <div id="board" class="board-container"></div>
      <div class="hint-text">빈 칸과 인접한 조각을 클릭하거나 방향키(↑ ↓ ← →)로 이동할 수 있습니다.</div>

      <div id="winBanner" class="win-banner">
        <div class="win-card">
          <h2>COMPLETE!</h2>
          <p id="winSummary">퍼즐을 완성했습니다.</p>
          <div class="btn-row" style="justify-content:center; margin-top:16px;">
            <button id="playAgainBtn" class="primary" type="button">같은 이미지 다시 섞기</button>
            <button id="nextRandomBtn" class="secondary" type="button">다음 랜덤 이미지</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    'use strict';

    const state = {
      rows: 3,
      cols: 3,
      tiles: [],       // 0 .. rows*cols - 1, where (rows*cols - 1) is empty
      emptyIdx: 8,
      moves: 0,
      seconds: 0,
      timerId: null,
      started: false,
      solved: false,
      showNumbers: true,
      imageUrl: '',
      imgWidth: 600,
      imgHeight: 600,
      jpegPool: [],    // File[] from folder selection
      lastPoolIdx: -1
    };

    const el = {
      board: document.getElementById('board'),
      singleFileInput: document.getElementById('singleFileInput'),
      folderInput: document.getElementById('folderInput'),
      randomPickBtn: document.getElementById('randomPickBtn'),
      builtinRandomBtn: document.getElementById('builtinRandomBtn'),
      fileInfo: document.getElementById('fileInfo'),
      presetBtns: document.getElementById('presetBtns'),
      customRows: document.getElementById('customRows'),
      customCols: document.getElementById('customCols'),
      applyCustomBtn: document.getElementById('applyCustomBtn'),
      shuffleBtn: document.getElementById('shuffleBtn'),
      togglePreviewBtn: document.getElementById('togglePreviewBtn'),
      toggleNumBtn: document.getElementById('toggleNumBtn'),
      moveCount: document.getElementById('moveCount'),
      timerText: document.getElementById('timerText'),
      previewBox: document.getElementById('previewBox'),
      previewImg: document.getElementById('previewImg'),
      winBanner: document.getElementById('winBanner'),
      winSummary: document.getElementById('winSummary'),
      playAgainBtn: document.getElementById('playAgainBtn'),
      nextRandomBtn: document.getElementById('nextRandomBtn')
    };

    // Generate built-in sample artwork so the game works immediately on open
    function createSampleDataUrl(seed = 1) {
      const c = document.createElement('canvas');
      c.width = 720;
      c.height = 720;
      const ctx = c.getContext('2d');

      const palettes = [
        ['#1d3557', '#457b9d', '#a8dadc', '#f4a261', '#e76f51'],
        ['#2b2d42', '#8d99ae', '#ef233c', '#ffd166', '#06d6a0'],
        ['#264653', '#2a9d8f', '#e9c46a', '#f4a261', '#e76f51']
      ];
      const pal = palettes[seed % palettes.length];

      const grad = ctx.createLinearGradient(0, 0, 720, 720);
      grad.addColorStop(0, pal[0]);
      grad.addColorStop(0.5, pal[1]);
      grad.addColorStop(1, pal[2]);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 720, 720);

      for (let i = 0; i < 14; i++) {
        ctx.beginPath();
        ctx.fillStyle = pal[(i + seed) % pal.length] + 'aa';
        const x = ((i * 137 + seed * 91) % 620) + 50;
        const y = ((i * 193 + seed * 53) % 620) + 50;
        const r = 45 + ((i * 29) % 95);
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 6;
      ctx.strokeRect(24, 24, 672, 672);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 48px Trebuchet MS, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('WONDER WORLD', 360, 345);
      ctx.font = 'bold 26px Trebuchet MS, sans-serif';
      ctx.fillText('JPEG SLIDING PUZZLE #' + seed, 360, 392);

      return c.toDataURL('image/jpeg', 0.92);
    }

    function isJpegFile(file) {
      if (!file) return false;
      const name = file.name.toLowerCase();
      return file.type === 'image/jpeg' || name.endsWith('.jpg') || name.endsWith('.jpeg');
    }

    function loadImageFromUrl(url, labelText) {
      const img = new Image();
      img.onload = () => {
        state.imageUrl = url;
        state.imgWidth = img.naturalWidth || 600;
        state.imgHeight = img.naturalHeight || 600;
        el.previewImg.src = url;
        el.fileInfo.textContent = '현재 이미지: ' + labelText + ' (' + state.imgWidth + '×' + state.imgHeight + ')';
        initPuzzle();
      };
      img.src = url;
    }

    function loadFile(file, prefix = '') {
      if (!isJpegFile(file)) {
        alert('JPEG(.jpg / .jpeg) 파일만 지원합니다.');
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        const label = prefix ? `${prefix} - ${file.name}` : file.name;
        loadImageFromUrl(e.target.result, label);
      };
      reader.readAsDataURL(file);
    }

    function pickRandomFromPool() {
      if (state.jpegPool.length === 0) {
        // Fallback to built-in sample if no folder selected yet
        const seed = Math.floor(Math.random() * 90) + 10;
        loadImageFromUrl(createSampleDataUrl(seed), `기본 샘플 #${seed} (로컬 폴더를 먼저 선택하면 내 JPEG에서 랜덤 추출됩니다)`);
        return;
      }
      let idx = Math.floor(Math.random() * state.jpegPool.length);
      if (state.jpegPool.length > 1 && idx === state.lastPoolIdx) {
        idx = (idx + 1) % state.jpegPool.length;
      }
      state.lastPoolIdx = idx;
      const chosen = state.jpegPool[idx];
      loadFile(chosen, `랜덤 (${idx + 1}/${state.jpegPool.length})`);
    }

    function stopTimer() {
      if (state.timerId) {
        clearInterval(state.timerId);
        state.timerId = null;
      }
    }

    function startTimer() {
      if (state.timerId) return;
      state.timerId = setInterval(() => {
        state.seconds++;
        updateTimerUI();
      }, 1000);
    }

    function updateTimerUI() {
      const m = String(Math.floor(state.seconds / 60)).padStart(2, '0');
      const s = String(state.seconds % 60).padStart(2, '0');
      el.timerText.textContent = `${m}:${s}`;
    }

    // Generate a guaranteed solvable board via valid random moves from solved state
    function shuffleSolvable(rows, cols) {
      const total = rows * cols;
      const arr = Array.from({ length: total }, (_, i) => i);
      let empty = total - 1;
      let prevEmpty = -1;

      const steps = Math.max(80, total * total * 4);
      for (let s = 0; s < steps; s++) {
        const er = Math.floor(empty / cols);
        const ec = empty % cols;
        const neighbors = [];
        if (er > 0) neighbors.push(empty - cols);
        if (er < rows - 1) neighbors.push(empty + cols);
        if (ec > 0) neighbors.push(empty - 1);
        if (ec < cols - 1) neighbors.push(empty + 1);

        const filtered = neighbors.filter(n => n !== prevEmpty);
        const pick = filtered[Math.floor(Math.random() * filtered.length)];
        arr[empty] = arr[pick];
        arr[pick] = total - 1;
        prevEmpty = empty;
        empty = pick;
      }

      // Ensure it is not accidentally already solved
      if (arr.every((v, i) => v === i) && total > 1) {
        const swapIdx = total - 2;
        arr[total - 1] = arr[swapIdx];
        arr[swapIdx] = total - 1;
        empty = swapIdx;
      }

      return { tiles: arr, emptyIdx: empty };
    }

    function initPuzzle() {
      stopTimer();
      state.moves = 0;
      state.seconds = 0;
      state.started = false;
      state.solved = false;
      el.moveCount.textContent = '0';
      updateTimerUI();
      el.winBanner.classList.remove('show');

      const { tiles, emptyIdx } = shuffleSolvable(state.rows, state.cols);
      state.tiles = tiles;
      state.emptyIdx = emptyIdx;
      renderBoard();
    }

    function getBoardDimensions() {
      const maxW = Math.min(window.innerWidth - 60, 680);
      const maxH = Math.min(window.innerHeight - 130, 620);
      const aspect = state.imgWidth / state.imgHeight;

      let boardW = maxW;
      let boardH = boardW / aspect;
      if (boardH > maxH) {
        boardH = maxH;
        boardW = boardH * aspect;
      }
      boardW = Math.max(240, Math.floor(boardW));
      boardH = Math.max(240, Math.floor(boardH));
      return { boardW, boardH };
    }

    function renderBoard() {
      const { rows, cols, tiles } = state;
      const total = rows * cols;
      const emptyVal = total - 1;
      const { boardW, boardH } = getBoardDimensions();

      const tileW = boardW / cols;
      const tileH = boardH / rows;

      el.board.style.gridTemplateColumns = `repeat(${cols}, ${tileW}px)`;
      el.board.style.gridTemplateRows = `repeat(${rows}, ${tileH}px)`;
      el.board.innerHTML = '';

      tiles.forEach((val, idx) => {
        const div = document.createElement('div');
        div.className = 'tile' + (val === emptyVal ? ' empty' : '');
        div.style.width = `${tileW}px`;
        div.style.height = `${tileH}px`;

        if (val !== emptyVal) {
          const origR = Math.floor(val / cols);
          const origC = val % cols;
          div.style.backgroundImage = `url("${state.imageUrl}")`;
          div.style.backgroundSize = `${boardW}px ${boardH}px`;
          div.style.backgroundPosition = `-${origC * tileW}px -${origR * tileH}px`;

          if (state.showNumbers) {
            const badge = document.createElement('span');
            badge.className = 'num';
            badge.textContent = String(val + 1);
            div.appendChild(badge);
          }

          div.addEventListener('click', () => tryMove(idx));
        }

        el.board.appendChild(div);
      });
    }

    function tryMove(idx) {
      if (state.solved) return;
      const { cols, emptyIdx } = state;
      const r1 = Math.floor(idx / cols), c1 = idx % cols;
      const r2 = Math.floor(emptyIdx / cols), c2 = emptyIdx % cols;

      if (Math.abs(r1 - r2) + Math.abs(c1 - c2) !== 1) return;

      if (!state.started) {
        state.started = true;
        startTimer();
      }

      const temp = state.tiles[idx];
      state.tiles[idx] = state.tiles[emptyIdx];
      state.tiles[emptyIdx] = temp;
      state.emptyIdx = idx;

      state.moves++;
      el.moveCount.textContent = String(state.moves);
      renderBoard();
      checkWin();
    }

    function checkWin() {
      if (state.tiles.every((v, i) => v === i)) {
        state.solved = true;
        stopTimer();
        el.winSummary.textContent = `${state.rows}×${state.cols} 퍼즐 클리어! · 이동 ${state.moves}회 · 시간 ${el.timerText.textContent}`;
        el.winBanner.classList.add('show');
      }
    }

    function setGridSize(r, c) {
      const rows = Math.max(2, Math.min(15, parseInt(r, 10) || 3));
      const cols = Math.max(2, Math.min(15, parseInt(c, 10) || 3));
      state.rows = rows;
      state.cols = cols;
      el.customRows.value = rows;
      el.customCols.value = cols;

      document.querySelectorAll('#presetBtns button').forEach(btn => {
        const br = Number(btn.dataset.r);
        const bc = Number(btn.dataset.c);
        btn.classList.toggle('active', br === rows && bc === cols);
      });

      initPuzzle();
    }

    // Event bindings
    el.singleFileInput.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (file) loadFile(file, '지정 파일');
      e.target.value = '';
    });

    el.folderInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files || []).filter(isJpegFile);
      if (files.length === 0) {
        alert('선택한 폴더에 .jpg 또는 .jpeg 파일이 없습니다.');
        return;
      }
      state.jpegPool = files;
      state.lastPoolIdx = -1;
      pickRandomFromPool();
      e.target.value = '';
    });

    el.randomPickBtn.addEventListener('click', pickRandomFromPool);

    el.builtinRandomBtn.addEventListener('click', () => {
      const seed = Math.floor(Math.random() * 90) + 10;
      loadImageFromUrl(createSampleDataUrl(seed), `기본 샘플 아트 #${seed}`);
    });

    el.presetBtns.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-r]');
      if (!btn) return;
      setGridSize(btn.dataset.r, btn.dataset.c);
    });

    el.applyCustomBtn.addEventListener('click', () => {
      setGridSize(el.customRows.value, el.customCols.value);
    });

    el.shuffleBtn.addEventListener('click', initPuzzle);
    el.playAgainBtn.addEventListener('click', initPuzzle);
    el.nextRandomBtn.addEventListener('click', pickRandomFromPool);

    el.togglePreviewBtn.addEventListener('click', () => {
      el.previewBox.classList.toggle('show');
    });

    el.toggleNumBtn.addEventListener('click', () => {
      state.showNumbers = !state.showNumbers;
      el.toggleNumBtn.textContent = `번호 표시: ${state.showNumbers ? 'ON' : 'OFF'}`;
      renderBoard();
    });

    window.addEventListener('keydown', (e) => {
      if (state.solved) return;
      const { rows, cols, emptyIdx } = state;
      const er = Math.floor(emptyIdx / cols);
      const ec = emptyIdx % cols;
      let target = -1;

      if (e.key === 'ArrowUp' && er < rows - 1) target = emptyIdx + cols;
      else if (e.key === 'ArrowDown' && er > 0) target = emptyIdx - cols;
      else if (e.key === 'ArrowLeft' && ec < cols - 1) target = emptyIdx + 1;
      else if (e.key === 'ArrowRight' && ec > 0) target = emptyIdx - 1;

      if (target !== -1) {
        e.preventDefault();
        tryMove(target);
      }
    });

    window.addEventListener('resize', () => {
      if (state.imageUrl) renderBoard();
    });

    // Boot with initial sample image
    loadImageFromUrl(createSampleDataUrl(1), '기본 샘플 아트 #1');
  </script>
</body>
</html>
