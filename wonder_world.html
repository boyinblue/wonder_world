<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Wonder World</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    canvas { border: 3px solid #333; display: block; }
    #controls {
      color: #666;
      font-family: monospace;
      font-size: 12px;
      margin-top: 6px;
      letter-spacing: 1px;
    }
    #rankInput {
      display: none;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.85);
      border: 2px solid #ffee44;
      border-radius: 10px;
      padding: 24px 36px;
      text-align: center;
      color: #fff;
      font-family: monospace;
      z-index: 10;
    }
    #rankInput h2 { color: #ffee44; font-size: 22px; margin-bottom: 12px; }
    #rankInput p  { font-size: 14px; margin-bottom: 14px; color: #ccc; }
    #rankInput input {
      font-family: monospace; font-size: 20px;
      padding: 6px 14px; border-radius: 6px;
      border: 2px solid #ffee44; background: #222;
      color: #fff; width: 200px; text-align: center;
    }
    #rankInput button {
      display: block; margin: 14px auto 0;
      font-family: monospace; font-size: 16px;
      padding: 8px 28px; border-radius: 6px;
      border: none; background: #ffee44; color: #333;
      cursor: pointer; font-weight: bold;
    }
  </style>
</head>
<body>
<div style="position:relative;display:inline-block;">
<canvas id="game" width="800" height="480"></canvas>
<div id="rankInput">
  <h2>🏆 HIGH SCORE!</h2>
  <p id="rankScore"></p>
  <p>이름을 입력하세요 (최대 10자)</p>
  <input id="rankName" type="text" maxlength="10" placeholder="PLAYER" />
  <button id="rankOk">등록</button>
</div>
</div>
<div id="controls">← → 이동 &nbsp;|&nbsp; ↑ 점프 &nbsp;|&nbsp; SPACE 발사 &nbsp;|&nbsp; [1]나이프 [2]권총 [3]산탄총 [4]유도탄 [5]연발총</div>
<script>
'use strict';

// ════════════════════════════════════════
//  CANVAS SETUP
// ════════════════════════════════════════
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');
const W = 800, H = 480;

// ════════════════════════════════════════
//  AUDIO  (Web Audio API)
// ════════════════════════════════════════
let audioCtx   = null;
let bgmRunning = false;
let bgmTimeout = null;

// Simple 8-bit style melody
const MELODY = [
  [523, 0.20], [659, 0.20], [784, 0.20], [659, 0.20],
  [523, 0.40], [392, 0.20], [440, 0.20], [523, 0.40],
  [659, 0.20], [784, 0.20], [1047,0.20], [784, 0.20],
  [659, 0.40], [523, 0.20], [440, 0.20], [392, 0.80],
  [392, 0.20], [523, 0.20], [659, 0.20], [784, 0.20],
  [880, 0.40], [784, 0.20], [659, 0.20], [523, 0.80],
  [440, 0.20], [523, 0.20], [659, 0.20], [523, 0.20],
  [440, 0.40], [392, 0.20], [330, 0.20], [392, 0.80],
];
// Bass line
const BASS = [
  [130, 0.40], [130, 0.40], [147, 0.40], [147, 0.40],
  [164, 0.40], [164, 0.40], [147, 0.40], [147, 0.40],
  [164, 0.40], [164, 0.40], [174, 0.40], [174, 0.40],
  [196, 0.40], [196, 0.40], [174, 0.40], [174, 0.40],
];

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  startBGM();
}

function startBGM() {
  if (!audioCtx || bgmRunning) return;
  bgmRunning = true;
  playLoop();
}

function playLoop() {
  if (!audioCtx || !bgmRunning) return;
  let t = audioCtx.currentTime + 0.05;

  // Melody
  for (const [freq, dur] of MELODY) {
    const osc  = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.045, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur * 0.82);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur);
    t += dur;
  }

  // Bass
  let bt = audioCtx.currentTime + 0.05;
  for (const [freq, dur] of BASS) {
    const osc  = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.030, bt);
    gain.gain.exponentialRampToValueAtTime(0.001, bt + dur * 0.75);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(bt); osc.stop(bt + dur);
    bt += dur;
  }

  const total = MELODY.reduce((s, [,d]) => s + d, 0);
  bgmTimeout = setTimeout(() => { if (bgmRunning) playLoop(); }, total * 1000 - 150);
}

function stopBGM() {
  bgmRunning = false;
  if (bgmTimeout) { clearTimeout(bgmTimeout); bgmTimeout = null; }
}

function sfx(type) {
  if (!audioCtx) return;
  const osc  = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  switch (type) {
    case 'shoot':
      osc.type = 'square';
      osc.frequency.setValueAtTime(900, now);
      osc.frequency.exponentialRampToValueAtTime(200, now + 0.08);
      gain.gain.setValueAtTime(0.07, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      osc.start(now); osc.stop(now + 0.08);
      break;
    case 'empty':
      osc.type = 'square';
      osc.frequency.value = 80;
      gain.gain.setValueAtTime(0.05, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc.start(now); osc.stop(now + 0.06);
      break;
    case 'kill':
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(500, now);
      osc.frequency.exponentialRampToValueAtTime(55, now + 0.22);
      gain.gain.setValueAtTime(0.13, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
      osc.start(now); osc.stop(now + 0.22);
      break;
    case 'die':
      osc.type = 'square';
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.linearRampToValueAtTime(55, now + 0.5);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
      osc.start(now); osc.stop(now + 0.5);
      break;
    case 'item':
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523, now);
      osc.frequency.setValueAtTime(784, now + 0.08);
      osc.frequency.setValueAtTime(1047, now + 0.16);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
      osc.start(now); osc.stop(now + 0.3);
      break;
    case 'jump':
      osc.type = 'sine';
      osc.frequency.setValueAtTime(350, now);
      osc.frequency.exponentialRampToValueAtTime(700, now + 0.13);
      gain.gain.setValueAtTime(0.07, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
      osc.start(now); osc.stop(now + 0.13);
      break;
    case 'knife':
      osc.type = 'square';
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.exponentialRampToValueAtTime(110, now + 0.09);
      gain.gain.setValueAtTime(0.10, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
      osc.start(now); osc.stop(now + 0.09);
      break;
  }
}

// ════════════════════════════════════════
//  CONSTANTS
// ════════════════════════════════════════
const GRAVITY  = 0.55;
const JUMP_VY  = -13;
const SPEED    = 4;
const GROUND_Y = 370;   // top of ground surface
const PW = 36, PH = 50; // player width/height
const MAX_AMMO = 30;
const KNIFE_REACH = 1000;
const KNIFE_FRAMES = 18;
const KNIFE_COOL  = 36;

const WEAPON_NAMES = { 1:'🔪 나이프', 2:'🔫 권총', 3:'🔫 산탄총', 4:'🚀 유도탄', 5:'⚡ 연발총' };

// ════════════════════════════════════════
//  INPUT
// ════════════════════════════════════════
const keys = {};
document.addEventListener('keydown', e => {
  if (!keys[e.code]) {
    keys[e.code] = true;
    handleKey(e.code);
  }
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))
    e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// 마우스 상태
let mouseX = 0, mouseY = 0, mouseDown = false;
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
  mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
});
canvas.addEventListener('mousedown', e => {
  if (e.button === 0) {
    mouseDown = true;
    if (gs === 'playing' && player && weapon !== 5) doShootMouse();
  }
});
canvas.addEventListener('mouseup', e => { if (e.button === 0) mouseDown = false; });

function handleKey(code) {
  if (gs === 'title' || gs === 'gameover') {
    if (code === 'Space' || code === 'Enter') startGame();
    return;
  }
  if (gs !== 'playing') return;
  if (code === 'ArrowUp') { if (!player.crouch) doJump(); }
  // 핵 단쳐키
  if      (code === 'KeyG') hack.god          = !hack.god;
  else if (code === 'KeyA' && !['ArrowLeft','ArrowRight'].includes(code)) {} // 무시
  else if (code === 'KeyN') hack.nuke         = true;
  else if (code === 'KeyV') hack.speed        = !hack.speed;
  else if (code === 'KeyF') hack.infiniteAmmo = !hack.infiniteAmmo;
  // 무기 전환 (1~5)
  if      (code === 'Digit1') weapon = 1;
  else if (code === 'Digit2') weapon = 2;
  else if (code === 'Digit3') { if ((weaponAmmo[3]||0) > 0) weapon = 3; }
  else if (code === 'Digit4') { if ((weaponAmmo[4]||0) > 0) weapon = 4; }
  else if (code === 'Digit5') { if ((weaponAmmo[5]||0) > 0) weapon = 5; }
  if (code === 'Space') {
    if (weapon === 5) return; // 연발총은 update루프에서 처리
    doShoot();
  }
}

// ════════════════════════════════════════
//  GAME STATE VARIABLES
// ════════════════════════════════════════
let gs;           // 'title' | 'playing' | 'dead' | 'gameover'
let score, lives, ammo, cameraX, frameCount, deadTimer, genX;
let weapon, weaponAmmo, shootCooldown;
let hack = { god: false, infiniteAmmo: false, nuke: false, speed: false };
let player, bullets, enemies, items, particles, clouds, trees, groundSegs;

// ═══ RANKINGS ═══
let rankings = loadRankings();
function loadRankings() {
  try { return JSON.parse(localStorage.getItem('ww_rankings') || '[]'); } catch(e) { return []; }
}
function saveRankings() {
  try { localStorage.setItem('ww_rankings', JSON.stringify(rankings)); } catch(e) {}
}
function isHighScore(s) {
  return s > 0 && (rankings.length < 5 || s > rankings[rankings.length - 1].score);
}
function addRanking(name, s) {
  rankings.push({ name: name.toUpperCase().trim().slice(0, 10) || 'PLAYER', score: s });
  rankings.sort((a, b) => b.score - a.score);
  rankings = rankings.slice(0, 5);
  saveRankings();
}

// Rank input UI
const rankDiv   = document.getElementById('rankInput');
const rankScoreEl = document.getElementById('rankScore');
const rankNameEl  = document.getElementById('rankName');
const rankOkBtn   = document.getElementById('rankOk');
rankOkBtn.addEventListener('click', () => {
  addRanking(rankNameEl.value, score);
  rankDiv.style.display = 'none';
  gs = 'gameover';
  stopBGM();
});
rankNameEl.addEventListener('keydown', e => {
  if (e.code === 'Enter') rankOkBtn.click();
  e.stopPropagation();
});

// ════════════════════════════════════════
//  GAME INIT
// ════════════════════════════════════════
gs = 'title';

function startGame() {
  gs          = 'playing';
  score       = 0;
  lives       = 3;
  ammo        = MAX_AMMO;
  weapon      = 2;
  weaponAmmo  = { 3: 0, 4: 0, 5: 0 };
  shootCooldown = 0;
  hack        = { god: false, infiniteAmmo: false, nuke: false, speed: false };
  cameraX     = 0;
  frameCount  = 0;
  deadTimer   = 0;
  genX        = 0;

  groundSegs  = [];
  enemies     = [];
  bullets     = [];
  items       = [];
  particles   = [];
  trees       = [];

  // Long safe starting platform
  groundSegs.push({ x: 0, w: 750 });
  genX = 750;

  initClouds();
  genWorld(cameraX + W + 700);
  spawnPlayer();

  initAudio();
  if (!bgmRunning) startBGM();
}

function spawnPlayer() {
  player = {
    x: 140, y: GROUND_Y - PH,
    vx: 0,  vy: 0,
    onGround: false,
    facing:   1,
    inv:      0,
    anim:     0,
    animT:    0,
    knifeT:   0,
    knifeCool: 0,
    crouch:   false,
  };
}

// ════════════════════════════════════════
//  WORLD GENERATION
// ════════════════════════════════════════
function genWorld(toX) {
  while (genX < toX) {
    const w = 130 + Math.random() * 190;
    groundSegs.push({ x: genX, w });

    if (genX > 800) {
      // Ground enemy - 현재 세그먼트 위에 직접 스폰 (발판 보장)
      if (Math.random() < 0.98) {
        const spd = 1.4 + Math.min(score / 2000, 2.0) + Math.random() * 1.2;
        const spawnX = genX + 10 + Math.random() * Math.max(w - 20, 10);
        const spawnY = segGroundY({ x: genX, w }, spawnX) - 46;
        enemies.push({
          type:    'ground',
          x:       spawnX,
          y:       spawnY,
          w: 36,   h: 46,
          vx:      -spd,
          vy:      0,
          alive:   true,
          onGround: true,
          anim:    0,
          animT:   0,
        });
      }
      // Flying enemy (appears after some distance)
      if (genX > 1200 && Math.random() < 0.20) {
        const spd = 1.8 + Math.min(score / 2500, 1.8) + Math.random() * 1.0;
        const flyY = 160 + Math.random() * 130;
        enemies.push({
          type:    'fly',
          x:       genX + w + 120 + Math.random() * 400,
          y:       flyY,
          w: 44,   h: 34,
          vx:      -spd,
          vy:      0,
          alive:   true,
          onGround: false,
          anim:    0,
          animT:   0,
          bobT:    Math.random() * Math.PI * 2,
        });
      }
      // Heart
      if (Math.random() < 0.055) {
        items.push({
          x: genX + 30 + Math.random() * Math.max(w - 60, 20),
          y: GROUND_Y - 55,
          type: 'heart', alive: true, t: Math.random() * Math.PI * 2,
        });
      }
      // Ammo
      if (Math.random() < 0.10) {
        items.push({
          x: genX + 30 + Math.random() * Math.max(w - 60, 20),
          y: GROUND_Y - 55,
          type: 'ammo', alive: true, t: Math.random() * Math.PI * 2,
        });
      }
      // 무기 픽업 (산탄/유도/연발)
      if (Math.random() < 0.08) {
        const wpArr = ['weapon3','weapon4','weapon5'];
        items.push({
          x: genX + 30 + Math.random() * Math.max(w - 60, 20),
          y: GROUND_Y - 55,
          type: wpArr[Math.floor(Math.random()*wpArr.length)], alive: true, t: Math.random() * Math.PI * 2,
        });
      }
    }

    genX += w;

    // Gap or Slope (never in first 650 units)
    if (genX > 650) {
      const r = Math.random();
      if (r < 0.18) {
        // 슬로프(언덕): 오르막 + 내리막
        const slopeW = 70 + Math.random() * 90;
        const hillH  = 28 + Math.random() * 42;
        groundSegs.push({ x: genX, w: slopeW, y1: GROUND_Y, y2: GROUND_Y - hillH });
        genX += slopeW;
        groundSegs.push({ x: genX, w: slopeW, y1: GROUND_Y - hillH, y2: GROUND_Y });
        genX += slopeW;
      } else if (r < 0.36) {
        // 낭떠러지 (비율 줄임: 기존 38% → 약 18%)
        genX += 52 + Math.random() * 78;
      }
      // 나머지 ~64%는 이음새 없이 평지 연결
    }

    // Background tree
    if (Math.random() < 0.48) {
      trees.push({
        x:  genX - w * 0.5 + (Math.random() - 0.5) * w * 0.8,
        h:  90 + Math.random() * 70,
        tw: 16 + Math.random() * 14,
      });
    }
  }
}

function initClouds() {
  clouds = [];
  for (let i = 0; i < 8; i++) {
    clouds.push({
      x:  Math.random() * 1800 - 200,
      y:  28 + Math.random() * 110,
      w:  80 + Math.random() * 110,
      sp: 0.22 + Math.random() * 0.28,
    });
  }
}

// ════════════════════════════════════════
//  PLAYER ACTIONS
// ════════════════════════════════════════
function doJump() {
  if (player && player.onGround) {
    player.vy = JUMP_VY;
    player.onGround = false;
    sfx('jump');
  }
}

function hasAmmo() {
  if (weapon === 1) return false;
  if (weapon === 2) return ammo > 0;
  return (weaponAmmo[weapon] || 0) > 0;
}

function doShoot() {
  if (!player) return;
  // 1 나이프
  if (weapon === 1) { doKnife(); return; }
  // 엎드릴 때는 낮은 위치에서 발사
  const curPH = player.crouch ? 28 : PH;
  const bx = player.x + (player.facing === 1 ? PW + 4 : -4);
  const by = player.y + (PH - curPH) + curPH * 0.5;
  // 2 권총 (단발)
  if (weapon === 2) {
    if (ammo <= 0) { weapon = 1; doKnife(); return; }
    ammo--;
    bullets.push({ x: bx, y: by, vx: 12*player.facing, vy: 0, alive: true, type: 'pistol' });
    sfx('shoot'); return;
  }
  // 3 산탄총 (3발 포물선)
  if (weapon === 3) {
    if ((weaponAmmo[3]||0) <= 0) { weapon = ammo>0?2:1; doShoot(); return; }
    weaponAmmo[3]--;
    for (const vy of [-4.5, -2.0, 0.5]) {
      bullets.push({ x: bx, y: by, vx: 10*player.facing, vy, alive: true, type: 'triple' });
    }
    sfx('shoot'); return;
  }
  // 4 유도탄
  if (weapon === 4) {
    if ((weaponAmmo[4]||0) <= 0) { weapon = ammo>0?2:1; doShoot(); return; }
    weaponAmmo[4]--;
    bullets.push({ x: bx, y: by, vx: 8*player.facing, vy: 0, alive: true, type: 'homing', life: 200 });
    sfx('shoot'); return;
  }
  // 5 연발총
  if (weapon === 5) {
    if ((weaponAmmo[5]||0) <= 0) { weapon = ammo>0?2:1; doShoot(); return; }
    weaponAmmo[5]--;
    bullets.push({ x: bx, y: by, vx: 15*player.facing, vy: 0, alive: true, type: 'rapid' });
    sfx('shoot'); return;
  }
}

function doKnife() {
  if (!player || player.knifeCool > 0) return;
  player.knifeT   = KNIFE_FRAMES;
  player.knifeCool = KNIFE_COOL;
  sfx('knife');
}

function doShootMouse() {
  if (!player) return;
  if (weapon === 1) { doKnife(); return; }
  // 총구 위치 (캔버스 좌표)
  const curPH = player.crouch ? 28 : PH;
  const gunWorldX = player.x + (player.facing === 1 ? PW + 4 : -4);
  const gunScreenX = gunWorldX - cameraX;
  const gunScreenY = player.y + (PH - curPH) + curPH * 0.5;
  // 마우스 방향 각도
  const angle = Math.atan2(mouseY - gunScreenY, mouseX - gunScreenX);
  const speed = 14;
  const vx = Math.cos(angle) * speed;
  const vy = Math.sin(angle) * speed;
  const bx = gunWorldX;
  const by = gunScreenY;

  if (weapon === 2) {
    if (ammo <= 0) { weapon = 1; doKnife(); return; }
    ammo--;
    bullets.push({ x: bx, y: by, vx, vy, alive: true, type: 'pistol' });
    sfx('shoot'); return;
  }
  if (weapon === 3) {
    if ((weaponAmmo[3]||0) <= 0) { weapon = ammo>0?2:1; doShootMouse(); return; }
    weaponAmmo[3]--;
    for (const spread of [-0.18, 0, 0.18]) {
      const a = angle + spread;
      bullets.push({ x: bx, y: by, vx: Math.cos(a)*10, vy: Math.sin(a)*10, alive: true, type: 'triple' });
    }
    sfx('shoot'); return;
  }
  if (weapon === 4) {
    if ((weaponAmmo[4]||0) <= 0) { weapon = ammo>0?2:1; doShootMouse(); return; }
    weaponAmmo[4]--;
    bullets.push({ x: bx, y: by, vx, vy, alive: true, type: 'homing', life: 200 });
    sfx('shoot'); return;
  }
  if (weapon === 5) {
    if ((weaponAmmo[5]||0) <= 0) { weapon = ammo>0?2:1; return; }
    weaponAmmo[5]--;
    bullets.push({ x: bx, y: by, vx: Math.cos(angle)*15, vy: Math.sin(angle)*15, alive: true, type: 'rapid' });
    sfx('shoot'); return;
  }
}

// ════════════════════════════════════════
//  HELPERS
// ════════════════════════════════════════
function overlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function segGroundY(seg, worldX) {
  if (seg.y1 !== undefined) {
    const t = Math.max(0, Math.min(1, (worldX - seg.x) / seg.w));
    return seg.y1 + (seg.y2 - seg.y1) * t;
  }
  return GROUND_Y;
}

function groundYBelow(worldX) {
  for (const seg of groundSegs) {
    if (worldX >= seg.x && worldX <= seg.x + seg.w) return segGroundY(seg, worldX);
  }
  return null;
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const ang = (Math.PI * 2 * i / n) + Math.random() * 0.6;
    const spd = 2 + Math.random() * 4;
    particles.push({
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd - 1.5,
      life: 28 + Math.random() * 24,
      maxL: 52,
      color,
      r: 2.5 + Math.random() * 2.5,
    });
  }
}

function killPlayer() {
  if (gs === 'dead') return;
  if (hack.god) return;  // 무적 모드
  lives = Math.max(0, lives - 1);
  burst(player.x + PW / 2, player.y + PH / 2, '#88aaff', 16);
  sfx('die');
  gs        = 'dead';
  deadTimer = 90;
}

// ════════════════════════════════════════
//  UPDATE
// ════════════════════════════════════════
function update() {
  if (gs === 'dead') {
    deadTimer--;
    updateParticles();
    if (deadTimer <= 0) {
      if (lives <= 0) {
        stopBGM();
        if (isHighScore(score)) {
          rankDiv.style.display = 'block';
          rankScoreEl.textContent = `점수: ${score}`;
          rankNameEl.value = '';
          rankNameEl.focus();
          gs = 'rankinput';
        } else {
          gs = 'gameover';
        }
      } else {
        gs = 'playing';
        spawnPlayer();
        // 부활 위치: 카메라 근처에서 가장 가까운 안전한 발판 위
        const respawnTargetX = cameraX + 90;
        let safeSeg = null;
        let minDist = Infinity;
        for (const seg of groundSegs) {
          if (seg.x + seg.w < cameraX) continue; // 화면 밖 왼쪽 발판 제외
          if (seg.y1 !== undefined && seg.y1 !== seg.y2) continue; // 슬로프 제외
          const segCenterX = seg.x + seg.w / 2;
          const dist = Math.abs(segCenterX - respawnTargetX);
          if (dist < minDist) { minDist = dist; safeSeg = seg; }
        }
        if (safeSeg) {
          player.x = Math.max(safeSeg.x + 10, Math.min(safeSeg.x + safeSeg.w - PW - 10, respawnTargetX));
          player.y = GROUND_Y - PH - 2;
        } else {
          player.x = respawnTargetX;
          player.y = GROUND_Y - PH - 30;
        }
        player.inv = 120;
      }
    }
    return;
  }

  if (gs === 'title' || gs === 'gameover' || gs === 'rankinput') return;

  frameCount++;

  // 핵: 무한 탄약
  if (hack.infiniteAmmo) { ammo = MAX_AMMO; weaponAmmo[3]=999; weaponAmmo[4]=999; weaponAmmo[5]=999; }

  // 자동 무기 전환: 현재 무기 탄약 소진 시 즉시 다른 무기로 변경
  if (weapon === 2 && ammo <= 0) {
    if ((weaponAmmo[3]||0) > 0) weapon = 3;
    else if ((weaponAmmo[4]||0) > 0) weapon = 4;
    else if ((weaponAmmo[5]||0) > 0) weapon = 5;
    else weapon = 1;
  } else if (weapon === 3 && (weaponAmmo[3]||0) <= 0) {
    if (ammo > 0) weapon = 2;
    else if ((weaponAmmo[4]||0) > 0) weapon = 4;
    else if ((weaponAmmo[5]||0) > 0) weapon = 5;
    else weapon = 1;
  } else if (weapon === 4 && (weaponAmmo[4]||0) <= 0) {
    if (ammo > 0) weapon = 2;
    else if ((weaponAmmo[3]||0) > 0) weapon = 3;
    else if ((weaponAmmo[5]||0) > 0) weapon = 5;
    else weapon = 1;
  } else if (weapon === 5 && (weaponAmmo[5]||0) <= 0) {
    if (ammo > 0) weapon = 2;
    else if ((weaponAmmo[3]||0) > 0) weapon = 3;
    else if ((weaponAmmo[4]||0) > 0) weapon = 4;
    else weapon = 1;
  }

  // 핵: 뉵크
  if (hack.nuke) {
    hack.nuke = false;
    for (const e of enemies) {
      if (!e.alive) continue;
      e.alive = false; score += 100;
      burst(e.x+e.w/2, e.y+e.h/2, '#ff8800', 14);
    }
    sfx('kill');
  }

  // 핵: 스피드
  const curBaseSpeed = hack.speed ? SPEED * 2.5 : SPEED;

  // ── Player input & physics ──
  const crouching = keys['ArrowDown'] && player.onGround;
  player.crouch = crouching;
  const curPH = crouching ? 28 : PH;
  const curSpeed = crouching ? curBaseSpeed * 0.45 : curBaseSpeed;

  if (keys['ArrowRight']) { player.vx = curSpeed;   player.facing =  1; }
  else if (keys['ArrowLeft'])  { player.vx = -curSpeed;  player.facing = -1; }
  else                         { player.vx = 0; }

  player.vy += GRAVITY;
  player.x  += player.vx;
  player.y  += player.vy;

  // Don't go left of camera left edge
  if (player.x < cameraX + 6) player.x = cameraX + 6;

  // Ground collision
  player.onGround = false;
  for (const seg of groundSegs) {
    if (player.x + PW > seg.x && player.x < seg.x + seg.w) {
      const segY = segGroundY(seg, player.x + PW / 2);
      if (player.vy >= 0 && player.y + PH > segY && player.y + PH < segY + 32) {
        player.y        = segY - PH;
        player.vy       = 0;
        player.onGround = true;
        break;
      }
    }
  }

  // Fell into hole
  if (player.y > H + 80) { killPlayer(); return; }

  // Camera
  const tgt = player.x - W * 0.32;
  if (tgt > cameraX) cameraX = tgt;

  // Advance world generation
  genWorld(cameraX + W + 700);

  // ── 1초(60프레임)마다 화면 오른쪽 끝에서 적 강제 스폰 ──
  if (frameCount % 60 === 0) {
    const spd = 1.4 + Math.min(score / 2000, 2.0) + Math.random() * 1.2;
    // 화면 오른쪽에서 발판이 있는 세그먼트 찾기
    const targetX = cameraX + W + 60 + Math.random() * 200;
    const spawnSeg = groundSegs.find(seg =>
      seg.y1 === undefined &&   // 슬로프 제외
      seg.x <= targetX && seg.x + seg.w >= targetX + 36
    ) || groundSegs.find(seg =>
      seg.y1 === undefined && seg.x > cameraX + W
    );
    if (spawnSeg) {
      const spawnX = Math.max(spawnSeg.x + 4, Math.min(spawnSeg.x + spawnSeg.w - 40, targetX));
      enemies.push({
        type: 'ground',
        x: spawnX,
        y: GROUND_Y - 46,
        w: 36, h: 46,
        vx: -spd, vy: 0,
        alive: true, onGround: true, anim: 0, animT: 0,
      });
    }
    if (cameraX > 1200 && frameCount % 180 === 0) {
      const flySpd = 1.8 + Math.min(score / 2500, 1.8) + Math.random() * 1.0;
      enemies.push({
        type: 'fly',
        x: cameraX + W + 80 + Math.random() * 200,
        y: 160 + Math.random() * 130,
        w: 44, h: 34,
        vx: -flySpd, vy: 0,
        alive: true, onGround: false, anim: 0, animT: 0,
        bobT: Math.random() * Math.PI * 2,
      });
    }
  }

  // Player animation
  player.animT++;
  if (player.animT >= 8) { player.animT = 0; player.anim = (player.anim + 1) % 4; }

  if (player.inv > 0) player.inv--;

  // ── Knife ──
  if (player.knifeCool > 0) player.knifeCool--;

  // 연발총 자동 사격 (SPACE 홀드 또는 마우스 홀드)
  if (weapon === 5 && (keys['Space'] || mouseDown) && gs === 'playing') {
    if (shootCooldown <= 0 && (weaponAmmo[5]||0) > 0) {
      if (mouseDown) doShootMouse(); else doShoot();
      shootCooldown = 3;
    }
  }
  if (shootCooldown > 0) shootCooldown--;

  if (player.knifeT > 0) {
    player.knifeT--;
    // Hit enemies in melee range (reach up for flying enemies too)
    const kx = player.facing === 1 ? player.x + PW : player.x - KNIFE_REACH;
    const ky = player.y - 20;
    for (const e of enemies) {
      if (!e.alive) continue;
      if (overlap(kx, ky, KNIFE_REACH, 70, e.x, e.y, e.w, e.h)) {
        e.alive = false;
        score  += 150;
        burst(e.x + e.w / 2, e.y + e.h / 2, '#ff8844', 12);
        sfx('kill');
      }
    }
  }

  // ── Bullets ──
  for (const b of bullets) {
    if (!b.alive) continue;
    // 포물선 중력 (산탄총)
    if (b.type === 'triple') b.vy = (b.vy||0) + 0.18;
    // 유도탄: 가장 가까운 적 추적
    if (b.type === 'homing') {
      b.life = (b.life||200) - 1;
      if (b.life <= 0) { b.alive = false; continue; }
      let nearest = null, nearDist = Infinity;
      for (const e of enemies) {
        if (!e.alive) continue;
        const d = Math.hypot(e.x+e.w/2 - b.x, e.y+e.h/2 - b.y);
        if (d < nearDist) { nearDist = d; nearest = e; }
      }
      if (nearest) {
        const ang = Math.atan2(nearest.y+nearest.h/2 - b.y, nearest.x+nearest.w/2 - b.x);
        const curAng = Math.atan2(b.vy||0, b.vx);
        let diff = ang - curAng;
        while (diff >  Math.PI) diff -= Math.PI*2;
        while (diff < -Math.PI) diff += Math.PI*2;
        const newAng = curAng + Math.sign(diff)*Math.min(Math.abs(diff), 0.12);
        const spd = Math.hypot(b.vx, b.vy||0) || 8;
        b.vx = Math.cos(newAng)*spd;
        b.vy = Math.sin(newAng)*spd;
      }
    }
    b.x += b.vx;
    b.y += (b.vy||0);
    if (b.x < cameraX - 120 || b.x > cameraX + W + 120 || b.y < -20 || b.y > H + 20) { b.alive = false; continue; }
    for (const e of enemies) {
      if (!e.alive) continue;
      if (overlap(b.x - 8, b.y - 8, 20, 16, e.x, e.y, e.w, e.h)) {
        e.alive = false;
        b.alive = false;
        score  += 100;
        burst(e.x + e.w / 2, e.y + e.h / 2, '#ff6633', 12);
        sfx('kill');
        break;
      }
    }
  }

  // ── Enemies ──
  for (const e of enemies) {
    if (!e.alive) continue;

    if (e.type === 'fly') {
      // Flying enemy: sine-wave bobbing, no gravity
      e.bobT += 0.045;
      e.x   += e.vx;
      e.y    = e.y + Math.sin(e.bobT) * 0.9; // gentle bob
      e.animT++;
      if (e.animT >= 10) { e.animT = 0; e.anim = (e.anim + 1) % 2; }
      if (e.x + e.w < cameraX - 60) { e.alive = false; continue; }
      if (player.inv === 0) {
        const ph = player.crouch ? 28 : PH;
        const hy = player.y + PH - ph;  // align bottom of hitbox to player foot
        if (overlap(player.x + 4, hy + 4, PW - 8, ph - 8, e.x, e.y, e.w, e.h)) {
          // 밟기 공격: 점프 중 낙하하면서 상단에 닿을 때
          if (!player.onGround && player.vy > 0 && (player.y + PH) <= e.y + e.h * 0.30) {
            e.alive = false;
            score += 50;
            burst(e.x + e.w / 2, e.y + e.h / 2, '#ffdd00', 12);
            sfx('kill');
            player.vy = JUMP_VY * 0.55;
          } else {
            killPlayer(); return;
          }
        }
      }
      continue;
    }

    // Gap detection: look ahead far enough to react in time
    if (e.onGround) {
      const lookDist = Math.abs(e.vx) * 22 + 24; // scale with speed
      const edgeX = e.vx < 0 ? e.x - lookDist : e.x + e.w + lookDist;
      const hasFloor = groundSegs.some(seg => edgeX >= seg.x && edgeX <= seg.x + seg.w);
      if (!hasFloor) {
        e.vy = JUMP_VY * 0.92;
        e.onGround = false;
      }
    }

    e.x  += e.vx;
    e.vy += GRAVITY;
    e.y  += e.vy;
    e.onGround = false;
    for (const seg of groundSegs) {
      if (e.x + e.w > seg.x && e.x < seg.x + seg.w) {
        const segY = segGroundY(seg, e.x + e.w / 2);
        if (e.vy >= 0 && e.y + e.h > segY && e.y + e.h < segY + 60) {
          e.y        = segY - e.h;
          e.vy       = 0;
          e.onGround = true;
          break;
        }
      }
    }
    if (!e.onGround && e.y > H + 80) { e.alive = false; continue; }

    e.animT++;
    if (e.animT >= 12) { e.animT = 0; e.anim = (e.anim + 1) % 2; }

    // Collide with player — use crouch hitbox
    if (player.inv === 0) {
      const ph = player.crouch ? 28 : PH;
      const hy = player.y + PH - ph;  // align bottom of hitbox to player foot
      if (overlap(player.x + 4, hy + 4, PW - 8, ph - 8, e.x, e.y, e.w, e.h)) {
        // 밟기 공격(스텀프): 점프 중 낙하하면서 적 머리(상단 30%) 위에 닿을 때만
        if (!player.onGround && player.vy > 0 && (player.y + PH) <= e.y + e.h * 0.30) {
          e.alive = false;
          score += 50;
          burst(e.x + e.w / 2, e.y + e.h / 2, '#ffdd00', 12);
          sfx('kill');
          player.vy = JUMP_VY * 0.55; // 밟은 후 튀어오르기
        } else {
          killPlayer(); return;
        }
      }
    }

    if (e.x + e.w < cameraX - 60) e.alive = false;
  }

  // ── Items ──
  for (const it of items) {
    if (!it.alive) continue;
    it.t += 0.06;
    const iy = it.y + Math.sin(it.t) * 6;
    if (overlap(player.x, player.y, PW, PH, it.x - 15, iy - 15, 30, 30)) {
      it.alive = false;
      if (it.type === 'heart') {
        lives++; sfx('item'); burst(it.x, it.y, '#ff66aa', 14);
      } else if (it.type === 'ammo') {
        ammo = Math.min(ammo + 10, MAX_AMMO); sfx('item'); burst(it.x, it.y, '#ffee44', 14);
      } else if (it.type === 'weapon3') {
        weaponAmmo[3] = Math.min((weaponAmmo[3]||0)+20, 60); weapon = 3; sfx('item'); burst(it.x, it.y, '#ff9800', 14);
      } else if (it.type === 'weapon4') {
        weaponAmmo[4] = Math.min((weaponAmmo[4]||0)+10, 30); weapon = 4; sfx('item'); burst(it.x, it.y, '#ab47bc', 14);
      } else if (it.type === 'weapon5') {
        weaponAmmo[5] = Math.min((weaponAmmo[5]||0)+30, 80); weapon = 5; sfx('item'); burst(it.x, it.y, '#00bcd4', 14);
      }
    }
  }

  // ── Clouds ──
  for (const c of clouds) {
    c.x -= c.sp;
    if (c.x + c.w < cameraX - 80) {
      c.x = cameraX + W + 80 + Math.random() * 300;
      c.y = 28 + Math.random() * 110;
      c.w = 80 + Math.random() * 110;
    }
  }

  // Score for distance
  if (frameCount % 60 === 0) score += 5;

  updateParticles();

  // ── Cleanup ──
  const edge = cameraX - 500;
  groundSegs = groundSegs.filter(s => s.x + s.w > edge);
  enemies    = enemies.filter(e => e.alive && e.x + e.w > edge);
  bullets    = bullets.filter(b => b.alive);
  items      = items.filter(it => it.alive && it.x > edge);
  trees      = trees.filter(t => t.x + 120 > edge);
  particles  = particles.filter(p => p.life > 0);
}

function updateParticles() {
  for (const p of particles) {
    p.x  += p.vx;
    p.y  += p.vy;
    p.vy += 0.22;
    p.life--;
  }
}

// ════════════════════════════════════════
//  DRAW HELPERS
// ════════════════════════════════════════
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y,     x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h,     x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y,         x + r, y);
  ctx.closePath();
}

function heart(x, y, s, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x,     y,      x - s, y,      x - s, y + s * 0.45);
  ctx.bezierCurveTo(x - s, y + s * 0.85, x, y + s * 1.15, x, y + s * 1.25);
  ctx.bezierCurveTo(x,     y + s * 1.15, x + s, y + s * 0.85, x + s, y + s * 0.45);
  ctx.bezierCurveTo(x + s, y,      x,     y,      x, y + s * 0.35);
  ctx.fill();
}

// ════════════════════════════════════════
//  DRAW SCENE OBJECTS
// ════════════════════════════════════════
function drawCloud(x, y, w) {
  ctx.fillStyle = 'rgba(255,255,255,0.88)';
  ctx.beginPath();
  ctx.ellipse(x + w * 0.50, y + 18, w * 0.34, 18, 0, 0, Math.PI * 2);
  ctx.ellipse(x + w * 0.28, y + 22, w * 0.24, 14, 0, 0, Math.PI * 2);
  ctx.ellipse(x + w * 0.73, y + 22, w * 0.22, 13, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawTree(x, h, tw) {
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.10)';
  ctx.beginPath();
  ctx.ellipse(x, GROUND_Y, tw * 2, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  // Trunk
  ctx.fillStyle = '#7B4F2E';
  ctx.fillRect(x - tw / 2, GROUND_Y - h, tw, h);
  // Foliage
  const fh = h * 0.72;
  ctx.fillStyle = '#2a6b20';
  ctx.beginPath();
  ctx.ellipse(x, GROUND_Y - h - fh * 0.35, tw * 3.0, fh * 0.55, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#368a2a';
  ctx.beginPath();
  ctx.ellipse(x, GROUND_Y - h - fh * 0.62, tw * 2.4, fh * 0.50, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#44aa36';
  ctx.beginPath();
  ctx.ellipse(x, GROUND_Y - h - fh * 0.85, tw * 1.6, fh * 0.40, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawGround(seg) {
  const sx = seg.x - cameraX;
  const isSlope = seg.y1 !== undefined && seg.y1 !== seg.y2;
  const isFlatCustom = seg.y1 !== undefined && seg.y1 === seg.y2;
  const gY = isFlatCustom ? seg.y1 : GROUND_Y;

  if (isSlope) {
    const sy1 = seg.y1; // 왼쪽 지면 Y
    const sy2 = seg.y2; // 오른쪽 지면 Y
    // 잔디 상단 띠
    ctx.fillStyle = '#3d7a18';
    ctx.beginPath();
    ctx.moveTo(sx,          sy1);
    ctx.lineTo(sx + seg.w,  sy2);
    ctx.lineTo(sx + seg.w,  sy2 + 4);
    ctx.lineTo(sx,          sy1 + 4);
    ctx.closePath(); ctx.fill();
    // 잔디
    ctx.fillStyle = '#5a9e2a';
    ctx.beginPath();
    ctx.moveTo(sx,          sy1 + 4);
    ctx.lineTo(sx + seg.w,  sy2 + 4);
    ctx.lineTo(sx + seg.w,  sy2 + 14);
    ctx.lineTo(sx,          sy1 + 14);
    ctx.closePath(); ctx.fill();
    // 흙
    ctx.fillStyle = '#8B5E3C';
    ctx.beginPath();
    ctx.moveTo(sx,          sy1 + 14);
    ctx.lineTo(sx + seg.w,  sy2 + 14);
    ctx.lineTo(sx + seg.w,  H);
    ctx.lineTo(sx,          H);
    ctx.closePath(); ctx.fill();
  } else {
    // Grass
    ctx.fillStyle = '#5a9e2a';
    ctx.fillRect(sx, gY, seg.w, 14);
    ctx.fillStyle = '#3d7a18';
    ctx.fillRect(sx, gY, seg.w, 4);
    // Dirt
    ctx.fillStyle = '#8B5E3C';
    ctx.fillRect(sx, gY + 14, seg.w, H - gY - 14);
    // Texture
    ctx.fillStyle = '#7A4E2A';
    for (let dx = 8; dx < seg.w - 8; dx += 36) {
      ctx.fillRect(sx + dx,      gY + 22, 18, 5);
      ctx.fillRect(sx + dx + 14, gY + 38, 14, 4);
    }
  }
}

function drawFlyEnemy(x, y, anim) {
  // Wings (flap)
  const wingUp = anim === 0;
  ctx.fillStyle = '#8833cc';
  // Left wing
  ctx.beginPath();
  ctx.moveTo(x + 8,  y + 14);

  // Tail / claws

  ctx.beginPath();
  ctx.moveTo(x + 18, y + 32); ctx.lineTo(x + 10, y + 44); ctx.lineTo(x + 16, y + 33); ctx.fill();

  ctx.moveTo(x + 28, y + 32); ctx.lineTo(x + 34, y + 44); ctx.lineTo(x + 30, y + 33); ctx.fill();
}

function drawPlayer(x, y, facing, anim, onGround, knifeT, shadowWorldX, crouch) {
  ctx.save();
  if (facing === -1) {
    ctx.translate(x + PW / 2, 0);
    ctx.scale(-1, 1);
    x = -PW / 2;
  }

  // Adjust y for crouch (keep feet in same place but compress sprite upward)
  const spriteY = crouch ? y + 22 : y;

  // Shadow — only if there is ground below the player
  const sgy = groundYBelow(shadowWorldX);
  if (sgy !== null) {
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath();
    ctx.ellipse(x + PW / 2, sgy + 4, 20, 5, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  if (crouch) {
    // ── CROUCH SPRITE ──
    // Shoes flat on ground
    ctx.fillStyle = '#331100';
    ctx.fillRect(x,      spriteY + 20, 17, 8);
    ctx.fillRect(x + 18, spriteY + 20, 17, 8);
    // Folded legs
    ctx.fillStyle = '#1a3d8a';
    ctx.fillRect(x +  2, spriteY + 14, 14, 10);
    ctx.fillRect(x + 18, spriteY + 14, 14, 10);
    // Body (squashed)
    ctx.fillStyle = '#3355cc';
    rrect(x + 2, spriteY + 5, 32, 12, 4); ctx.fill();
    // Belt
    ctx.fillStyle = '#885500';
    ctx.fillRect(x + 2, spriteY + 14, 32, 3);
    ctx.fillStyle = '#ffcc00';
    ctx.fillRect(x + 14, spriteY + 14, 8, 3);
    // Arms stretched forward (crawling pose)
    ctx.fillStyle = '#3355cc';
    ctx.fillRect(x - 5, spriteY + 7, 9, 9);
    ctx.fillRect(x + 33, spriteY + 7, 9, 9);
    // Gun or Knife (held low) - weapon 별 이미지
    if (weapon === 1) {
      // 나이프: 짧고 빛나는 날
      ctx.fillStyle = '#aaaaaa';
      ctx.fillRect(x + 33, spriteY + 6, 24, 4);
      ctx.fillStyle = '#dddddd';
      ctx.fillRect(x + 45, spriteY + 5, 12, 2);
      ctx.fillStyle = '#774400';
      ctx.fillRect(x + 33, spriteY + 5, 7, 7);
    } else if (weapon === 2) {
      // 권총
      ctx.fillStyle = '#555';
      ctx.fillRect(x + 33, spriteY + 8, 18, 5);
      ctx.fillStyle = '#333';
      ctx.fillRect(x + 49, spriteY + 7, 4, 3);
      ctx.fillStyle = '#774400';
      ctx.fillRect(x + 35, spriteY + 12, 7, 6);
    } else if (weapon === 3) {
      // 산탄총: 이중 배럴
      ctx.fillStyle = '#555';
      ctx.fillRect(x + 33, spriteY + 5, 20, 4);
      ctx.fillRect(x + 33, spriteY + 12, 20, 4);
      ctx.fillStyle = '#333';
      ctx.fillRect(x + 50, spriteY + 4, 5, 13);
      ctx.fillStyle = '#774400';
      ctx.fillRect(x + 33, spriteY + 9, 10, 5);
    } else if (weapon === 4) {
      // 유도탄: 원통 로켓
      ctx.fillStyle = '#cc66ee';
      ctx.fillRect(x + 33, spriteY + 7, 18, 7);
      ctx.fillStyle = '#aa44cc';
      ctx.beginPath();
      ctx.ellipse(x + 52, spriteY + 10, 7, 4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ff4444';
      ctx.fillRect(x + 33, spriteY + 7, 5, 7);
    } else if (weapon === 5) {
      // 연발총: 긴 배럴
      ctx.fillStyle = '#335577';
      ctx.fillRect(x + 33, spriteY + 7, 28, 6);
      ctx.fillStyle = '#557799';
      ctx.fillRect(x + 57, spriteY + 6, 8, 3);
      ctx.fillStyle = '#774400';
      ctx.fillRect(x + 33, spriteY + 12, 9, 6);
    } else {
      ctx.fillStyle = '#aaaaaa';
      ctx.fillRect(x + 33, spriteY + 6, 28, 5);
      ctx.fillStyle = '#774400';
      ctx.fillRect(x + 33, spriteY + 5, 7, 8);
    }
    // Head low
    ctx.fillStyle = '#ffcc88';
    rrect(x + 5, spriteY - 2, 26, 16, 5); ctx.fill();
    // Eyes
    ctx.fillStyle = '#222';
    ctx.fillRect(x +  9, spriteY + 3, 4, 4);
    ctx.fillRect(x + 22, spriteY + 3, 4, 4);
    ctx.fillStyle = '#fff';
    ctx.fillRect(x + 10, spriteY + 4, 1, 2);
    ctx.fillRect(x + 23, spriteY + 4, 1, 2);
    // Hat (flat/tilted)
    ctx.fillStyle = '#cc4400';
    ctx.fillRect(x + 2,  spriteY - 4,  32, 6);
    ctx.fillRect(x + 9,  spriteY - 13, 20, 11);
    ctx.fillStyle = '#aa2200';
    ctx.fillRect(x + 2,  spriteY,      32, 3);
  } else {
    // ── NORMAL SPRITE ──
    // Legs
    const legA = onGround ? anim : 0;
    ctx.fillStyle = '#1a3d8a';
    if (legA === 0 || legA === 2) {
      ctx.fillRect(x +  4, spriteY + 37, 12, 15);
      ctx.fillRect(x + 20, spriteY + 37, 12, 15);
    } else if (legA === 1) {
      ctx.fillRect(x +  4, spriteY + 37, 12, 11);
      ctx.fillRect(x + 20, spriteY + 37, 12, 17);
    } else {
      ctx.fillRect(x +  4, spriteY + 37, 12, 17);
      ctx.fillRect(x + 20, spriteY + 37, 12, 11);
    }
    // Shoes
    ctx.fillStyle = '#331100';
    ctx.fillRect(x +  2, spriteY + 50, 16, 7);
    ctx.fillRect(x + 18, spriteY + 50, 16, 7);
    // Body
    ctx.fillStyle = '#3355cc';
    rrect(x + 2, spriteY + 19, 32, 19, 4); ctx.fill();
    // Belt
    ctx.fillStyle = '#885500';
    ctx.fillRect(x + 2, spriteY + 34, 32, 5);
    ctx.fillStyle = '#ffcc00';
    ctx.fillRect(x + 14, spriteY + 34, 8, 5);
    // Arms
    ctx.fillStyle = '#3355cc';
    ctx.fillRect(x - 5,  spriteY + 21, 8, 14);
    ctx.fillRect(x + 33, spriteY + 21, 8, 14);
    // Gun or Knife - weapon 별 이미지
    if (weapon === 1) {
      // 나이프
      const angle = knifeT > 0 ? -Math.PI * 0.7 * (knifeT / KNIFE_FRAMES) : -Math.PI * 0.15;
      ctx.save();
      ctx.translate(x + 36, spriteY + 28);
      ctx.rotate(angle);
      ctx.fillStyle = '#aaaaaa';
      ctx.fillRect(0, -3, 36, 6);
      ctx.fillStyle = '#cccccc';
      ctx.fillRect(18, -2, 18, 4);
      ctx.fillStyle = '#774400';
      ctx.fillRect(-8, -5, 10, 10);
      ctx.restore();
    } else if (weapon === 2) {
      // 권총
      ctx.fillStyle = '#555';
      ctx.fillRect(x + 33, spriteY + 25, 22, 7);
      ctx.fillStyle = '#333';
      ctx.fillRect(x + 53, spriteY + 24, 5, 4);
      ctx.fillStyle = '#774400';
      ctx.fillRect(x + 35, spriteY + 31, 9, 8);
    } else if (weapon === 3) {
      // 산탄총: 이중 배럴
      ctx.fillStyle = '#555';
      ctx.fillRect(x + 33, spriteY + 22, 24, 5);
      ctx.fillRect(x + 33, spriteY + 30, 24, 5);
      ctx.fillStyle = '#333';
      ctx.fillRect(x + 55, spriteY + 21, 5, 15);
      ctx.fillStyle = '#774400';
      ctx.fillRect(x + 35, spriteY + 27, 10, 7);
    } else if (weapon === 4) {
      // 유도탄: 로켓
      ctx.fillStyle = '#cc66ee';
      ctx.fillRect(x + 33, spriteY + 24, 22, 8);
      ctx.fillStyle = '#aa44cc';
      ctx.beginPath();
      ctx.ellipse(x + 56, spriteY + 28, 8, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ff4444';
      ctx.fillRect(x + 33, spriteY + 24, 6, 8);
    } else if (weapon === 5) {
      // 연발총: 긴 배럴
      ctx.fillStyle = '#335577';
      ctx.fillRect(x + 33, spriteY + 25, 30, 7);
      ctx.fillStyle = '#557799';
      ctx.fillRect(x + 59, spriteY + 23, 9, 4);
      ctx.fillStyle = '#774400';
      ctx.fillRect(x + 35, spriteY + 31, 9, 8);
    } else {
      // 탄약 없음: 칼
      const angle = knifeT > 0 ? -Math.PI * 0.7 * (knifeT / KNIFE_FRAMES) : -Math.PI * 0.15;
      ctx.save();
      ctx.translate(x + 36, spriteY + 28);
      ctx.rotate(angle);
      ctx.fillStyle = '#aaaaaa';
      ctx.fillRect(0, -3, 36, 6);
      ctx.fillStyle = '#cccccc';
      ctx.fillRect(18, -2, 18, 4);
      ctx.fillStyle = '#774400';
      ctx.fillRect(-8, -5, 10, 10);
      ctx.restore();
    }
    // Head
    ctx.fillStyle = '#ffcc88';
    rrect(x + 5, spriteY + 2, 26, 22, 6); ctx.fill();
    // Eyes
    ctx.fillStyle = '#222';
    ctx.fillRect(x +  9, spriteY + 9, 5, 5);
    ctx.fillRect(x + 22, spriteY + 9, 5, 5);
    ctx.fillStyle = '#fff';
    ctx.fillRect(x + 10, spriteY + 10, 2, 2);
    ctx.fillRect(x + 23, spriteY + 10, 2, 2);
    // Nose
    ctx.fillStyle = '#cc9966';
    ctx.fillRect(x + 17, spriteY + 15, 4, 3);
    // Smile
    ctx.fillStyle = '#aa5500';
    ctx.fillRect(x + 13, spriteY + 20, 11, 2);
    // Hat
    ctx.fillStyle = '#cc4400';
    ctx.fillRect(x + 2,  spriteY - 2,  32, 8);
    ctx.fillRect(x + 7,  spriteY - 14, 22, 14);
    ctx.fillStyle = '#aa2200';
    ctx.fillRect(x + 2,  spriteY + 3,  32, 3);
  }

  ctx.restore();
}

function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,0.62)';
  ctx.fillRect(0, 0, W, 62);

  // 생명
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 13px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('LIFE:', 10, 24);
  for (let i = 0; i < 5; i++) {
    heart(58 + i * 28, 9, 10, i < lives ? '#ff3366' : '#444');
  }

  // 점수
  ctx.font = 'bold 15px monospace';
  ctx.fillStyle = '#ffdd44';
  ctx.textAlign = 'right';
  ctx.fillText(`SCORE: ${score}`, W - 10, 24);

  // 핵 HUD
  if (hack.god || hack.infiniteAmmo || hack.speed) {
    const tags = [];
    if (hack.god)          tags.push('★GOD');
    if (hack.infiniteAmmo) tags.push('∞AMMO');
    if (hack.speed)        tags.push('⚡SPD');
    ctx.fillStyle = '#00ff88';
    ctx.font = 'bold 11px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('🛡️ ' + tags.join(' '), 10, 58);
  }

  // 무기 슬롯 바
  const SLOTS = [
    { id: 1, label: '1:나이프', icon: '🔪', color: '#7ec8e3' },
    { id: 2, label: '2:권총',   icon: '🔫', color: '#ffee44' },
    { id: 3, label: '3:산탄총', icon: '🔫', color: '#ff9800' },
    { id: 4, label: '4:유도탄', icon: '🚀', color: '#ab47bc' },
    { id: 5, label: '5:연발총', icon: '⚡',  color: '#00bcd4' },
  ];

  const slotW = 110, slotH = 28, slotY = 32, startX = W / 2 - (SLOTS.length * slotW) / 2;

  for (let i = 0; i < SLOTS.length; i++) {
    const sl = SLOTS[i];
    const sx = startX + i * slotW;
    const isSelected = weapon === sl.id;
    let available = true;
    if (sl.id === 3 || sl.id === 4 || sl.id === 5) available = (weaponAmmo[sl.id] || 0) > 0;

    ctx.save();
    ctx.globalAlpha = available ? 1.0 : 0.28;

    // 슬롯 배경
    ctx.fillStyle = isSelected ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.35)';
    rrect(sx + 2, slotY, slotW - 4, slotH, 5);
    ctx.fill();

    // 선택 테두리
    if (isSelected) {
      ctx.strokeStyle = sl.color;
      ctx.lineWidth = 2.5;
      ctx.shadowColor = sl.color;
      ctx.shadowBlur = 8;
      rrect(sx + 2, slotY, slotW - 4, slotH, 5);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    // 아이콘 + 라벨
    ctx.fillStyle = isSelected ? sl.color : '#bbb';
    ctx.font = isSelected ? 'bold 11px monospace' : '10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(sl.icon + ' ' + sl.label, sx + slotW / 2, slotY + 13);

    // 탄약 수
    ctx.fillStyle = isSelected ? '#fff' : '#999';
    ctx.font = '9px monospace';
    if (sl.id === 1) {
      ctx.fillText('∞', sx + slotW / 2, slotY + 25);
    } else if (sl.id === 2) {
      ctx.fillText(ammo + '/' + MAX_AMMO, sx + slotW / 2, slotY + 25);
    } else {
      ctx.fillText('×' + (weaponAmmo[sl.id] || 0), sx + slotW / 2, slotY + 25);
    }

    ctx.restore();
  }
}

function drawTitleScreen() {
  // Animated sky

  ctx.fillRect(0, 0, W, H);

  // Ground strip
  ctx.fillStyle = '#5a9e2a';
  ctx.fillRect(0, GROUND_Y, W, 14);
  ctx.fillStyle = '#8B5E3C';
  ctx.fillRect(0, GROUND_Y + 14, W, H - GROUND_Y - 14);

  ctx.fillStyle = 'rgba(0,0,0,0.58)';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.shadowColor = '#88ccff'; ctx.shadowBlur = 24;
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 54px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('WONDER WORLD', W / 2, H / 2 - 80);
  ctx.restore();

  ctx.fillStyle = '#ddeeff';
  ctx.font = '15px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('← → 이동  |  ↑ 점프  |  SPACE 발사 / 칼(탄약 없을 때)', W / 2, H / 2 - 12);
  ctx.fillText('[1]나이프  [2]권총  [3]산탄총  [4]유도탄  [5]연발총  (맵에서 픽업)', W / 2, H / 2 + 18);
  ctx.fillText('❤ 하트 = 목숨 +1   |   B 탄약 상자 = 탄약 +10', W / 2, H / 2 + 46);
  ctx.fillText('구멍에 빠지거나 적에 닿으면 사망', W / 2, H / 2 + 72);

  const rankH = rankings.length > 0 ? (30 + rankings.length * 26 + 10) : 0;
  if (rankings.length > 0) drawRankingsPanel(W / 2, H / 2 + 78);

  const blink = Math.floor(Date.now() / 520) % 2;
  if (blink) {
    const startY = rankings.length > 0 ? H / 2 + 78 + rankH + 24 : H / 2 + 110;
    ctx.fillStyle = '#ffee44';
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('▶  SPACE 또는 ENTER 로 시작  ◀', W / 2, Math.min(startY, H - 22));
  }
}

function drawRankingsPanel(cx, cy) {
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  rrect(cx - 190, cy - 14, 380, 30 + rankings.length * 26 + 10, 8);
  ctx.fill();
  ctx.fillStyle = '#ffee44';
  ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('🏆  RANKING  🏆', cx, cy + 10);
  if (rankings.length === 0) {
    ctx.fillStyle = '#888';
    ctx.font = '13px monospace';
    ctx.fillText('(아직 기록 없음)', cx, cy + 34);
  }
  for (let i = 0; i < rankings.length; i++) {
    const r = rankings[i];
    const medals = ['🥇','🥈','🥉','4️⃣','5️⃣'];
    ctx.fillStyle = i === 0 ? '#ffd700' : i === 1 ? '#c0c0c0' : i === 2 ? '#cd7f32' : '#aaaaaa';
    ctx.font = i < 3 ? 'bold 13px monospace' : '13px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`${medals[i]} ${r.name}`, cx - 160, cy + 34 + i * 26);
    ctx.textAlign = 'right';
    ctx.fillText(String(r.score).padStart(6, ' '), cx + 170, cy + 34 + i * 26);
  }
}

function drawGameOverScreen() {
  ctx.fillStyle = 'rgba(0,0,0,0.72)';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.shadowColor = '#ff4444'; ctx.shadowBlur = 24;
  ctx.fillStyle = '#ff5544';
  ctx.font = 'bold 58px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('GAME OVER', W / 2, H / 2 - 120);
  ctx.restore();

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 24px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`최종 점수: ${score}`, W / 2, H / 2 - 68);

  drawRankingsPanel(W / 2, H / 2 - 38);

  const blink = Math.floor(Date.now() / 520) % 2;
  if (blink) {
    ctx.fillStyle = '#ffee44';
    ctx.font = '17px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('SPACE 또는 ENTER 로 다시 시작', W / 2, H - 32);
  }
}

// ════════════════════════════════════════
//  MAIN DRAW
// ════════════════════════════════════════
function draw() {
  // Sky
  const sky = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  sky.addColorStop(0, '#5babd4');
  sky.addColorStop(1, '#c8e8f8');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // Clouds
  for (const c of clouds || []) drawCloud(c.x - cameraX, c.y, c.w);

  // Trees (background, slight parallax)
  for (const t of trees || []) {
    drawTree(t.x - cameraX * 0.78, t.h, t.tw);
  }

  // Ground
  for (const seg of groundSegs || []) drawGround(seg);

  // Items
  for (const it of items || []) {
    if (!it.alive) continue;
    const iy = it.y + Math.sin(it.t) * 6;
    const ix = it.x - cameraX;
    if (it.type === 'heart') drawHeartItem(ix, iy);
    else if (it.type === 'ammo') drawAmmoItem(ix, iy);
    else drawWeaponPickupItem(ix, iy, it.type);
  }

  // Enemies
  for (const e of enemies || []) {
    if (!e.alive) continue;
    if (e.type === 'fly') drawFlyEnemy(e.x - cameraX, e.y, e.anim);
    else                  drawEnemy(e.x - cameraX, e.y, e.anim);
  }

  // Bullets
  for (const b of bullets || []) {
    if (!b.alive) continue;
    ctx.save();
    if (b.type === 'homing') {
      ctx.shadowColor = '#ab47bc'; ctx.shadowBlur = 10;
      ctx.fillStyle = '#ce93d8';
    } else if (b.type === 'triple') {
      ctx.fillStyle = '#ffb74d';
    } else if (b.type === 'rapid') {
      ctx.fillStyle = '#40e0ff';
    } else {
      ctx.shadowColor = '#ffaa00'; ctx.shadowBlur = 8;
      ctx.fillStyle = '#ffe040';
    }
    ctx.fillRect(b.x - cameraX - 6, b.y - 3, 16, 6);
    ctx.restore();
  }

  // Player
  if (player && (gs === 'playing' || gs === 'dead')) {
    const show = gs === 'dead' ? true : (player.inv % 6 < 3);
    if (show) drawPlayer(player.x - cameraX, player.y, player.facing, player.anim, player.onGround, player.knifeT, player.x + PW / 2, player.crouch);
  }

  // Particles
  for (const p of particles || []) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxL);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x - cameraX, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // HUD (only during gameplay)
  if (gs === 'playing' || gs === 'dead') drawHUD();

  // Death flash
  if (gs === 'dead') {
    ctx.fillStyle = 'rgba(200,50,50,0.22)';
    ctx.fillRect(0, 0, W, H);
  }

  // Overlays
  if (gs === 'title')      drawTitleScreen();
  if (gs === 'gameover')   drawGameOverScreen();
  if (gs === 'rankinput') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
  }
}

// ════════════════════════════════════════
//  GAME LOOP
// ════════════════════════════════════════
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</html>
